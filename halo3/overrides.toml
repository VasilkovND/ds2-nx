# A worker thread's wait for work spins without resting (src/halo3_hooks.cpp explains it). The hook sleeps
# 100 us on each repeat of the loop: 0x821A85C4 is only reached when the first look found nothing.
[[midasm_hook]]
address = 0x821A85C4
name = "Halo3WorkerPollYield"

# Diagnostic while the object crash of boots 8-11 is chased (src/halo3_hooks.cpp): logs object lookups in
# sub_8231D8D0 whose address is not readable. Remove once it is understood.
[[midasm_hook]]
address = 0x8231D910
name = "Halo3ObjectLookupCheck"
registers = ["r14", "r10", "r29"]
after_instruction = true
