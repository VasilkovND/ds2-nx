# ============================================================================
#  Halo 3 - manual declarations for the codegen
#
#  Included from halo3_manifest.toml via includes = ["overrides.toml"].
#  Included files use the flat schema (sections at the root). See
#  nfsmw_pal/overrides.toml for every field, explained.
#
#  Loose keys (cr_as_local and the like) must go above the first [table]:
#  in TOML a loose key belongs to the last table opened.
#
#  Performance keys (cr_as_local, non_volatile_as_local, xer_as_local,
#  ctr_as_local) are off until each is checked against Halo 3's code:
#  non_volatile_as_local breaks code that relies on setjmp/longjmp.
# ============================================================================

[functions]
# Reached only by a tail call (a plain `b`), which the analysis does not follow into a new function.
# Both are function starts in XenonAnalyse's map of the same default.xex (0x826CC8A0: 8 bytes, 0x826C5118: 40).
"0x826CC8A0" = {}   # from b at 0x826CEF7C
"0x826C5118" = {}   # from b at 0x826C49F4
"0x8258BDA0" = {}   # from b at 0x8258C094 (8 bytes into 0x8258BD98)
"0x825A2180" = {}   # from b at 0x8259FE40 (16 bytes into 0x825A2170): SwitchToFiber's body, unused once hooked ([rexcrt])

[rexcrt]
# XAPI's fiber functions, linked into default.xex. Halo 3 runs work (map decompression) on fibers with their own
# stacks. The real SwitchToFiber saves the caller's registers, loads the target fiber's (r1 and LR included) and
# returns into the target, which recompiled code cannot do: it returns through the host stack. The SDK's hooks
# (sdk/src/kernel/crt/threading.cpp) run each fiber on a host fiber instead. All five go together: its
# SwitchToFiber only knows fibers that its CreateFiber or ConvertThreadToFiber registered. Without them the
# fourth Switch boot crashed in the decompressor (0x822AF7D8) after a switch: r26 came back 0.
# Identified from their code: GetCurrentFiber (0x8259FC10) is r13 -> +0x100 (KTHREAD) -> +0x164.
ConvertThreadToFiber = 0x8259FC20  # allocates 2640 bytes; fails with 1280 (ERROR_ALREADY_FIBER)
ConvertFiberToThread = 0x8259FCB0  # frees it; fails with 1281 (ERROR_ALREADY_THREAD)
CreateFiber = 0x8259FD00           # (stack size, start, parameter): stack rounded up, 16 KiB minimum
DeleteFiber = 0x8259FDE0
SwitchToFiber = 0x8259FE40         # b 0x825A2180, the register save
